<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kerusakan Lab Komputer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loading-screen">
        <img src="img/logo.png" alt="Logo Sekolah" class="loading-logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22 viewBox=%220 0 120 120%22%3E%3Crect width=%22120%22 height=%22120%22 rx=%2220%22 fill=%22%230071e3%22/%3E%3Ctext x=%2260%22 y=%2270%22 font-size=%2236%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22%3ELOGO%3C/text%3E%3C/svg%3E'">
        <div class="loading-spinner"></div>
        <p class="loading-text">Memuat halaman...</p>
    </div>

    <!-- ===== KONTEN UTAMA (FORM) ===== -->
    <div id="main-content">
        <div class="card">
            <div class="card-header">
                <img src="img/logo.png" alt="Logo Sekolah" class="logo-small" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230071e3%22/%3E%3Ctext x=%2232%22 y=%2240%22 font-size=%2220%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22%3ELOGO%3C/text%3E%3C/svg%3E'">
                <h1>Form Laporan Kerusakan</h1>
                <p>Lab Komputer Sekolah</p>
            </div>

            <form id="laporanForm">
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <input type="text" id="kelas" name="kelas" placeholder="Contoh: XI RPL 1" required>
                </div>

                <div class="form-group">
                    <label for="kerusakan">Kerusakan yang Ingin Dilaporkan</label>
                    <textarea id="kerusakan" name="kerusakan" placeholder="Jelaskan kerusakan yang terjadi..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="kondisi">Kondisi Kerusakan</label>
                    <select id="kondisi" name="kondisi" required>
                        <option value="" disabled selected>-- Pilih Kondisi --</option>
                        <option value="Ringan">Ringan</option>
                        <option value="Sedang">Sedang</option>
                        <option value="Parah">Parah</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lab">Lab yang Mengalami Kerusakan</label>
                    <input type="text" id="lab" name="lab" placeholder="Contoh: Lab RPL 2" required>
                </div>

                <div class="form-group">
                    <label for="nomorKomputer">Nomor Komputer yang Mengalami Kerusakan</label>
                    <input type="text" id="nomorKomputer" name="nomorKomputer" placeholder="Contoh: PC-12" required>
                </div>

                <button type="submit" class="btn-submit">Kirim Laporan</button>
            </form>
        </div>
    </div>

    <!-- ===== HALAMAN BERHASIL ===== -->
    <div id="success-page" style="display: none; width: 100%; max-width: 560px;">
        <div class="success-page">
            <div class="success-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="4 12 10 18 20 6"></polyline>
                </svg>
            </div>
            <h2>Form Berhasil Dikirim!</h2>
            <p>Terima kasih, laporan kerusakan Anda telah kami terima.<br>Tim teknisi akan segera menindaklanjuti.</p>
            <a href="#" class="btn-back" id="btnKembali">Kembali ke Form</a>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
